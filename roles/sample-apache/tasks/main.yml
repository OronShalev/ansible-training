---
# tasks file for sample-apache
- name: install packages httpd, mod_ssl and php.
  ansible.builtin.yum:
    name:
      - httpd
      - mod_ssl
      - php
    state: present
  become: true

- name: Apache service is running and enabled on boot.
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  become: true

- name: Ensure firewalld is installed and running
  ansible.builtin.yum:
    name: firewalld
    state: present
  become: true

- name: Start and enable firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  become: true

- name: Allow HTTP service permanently
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Allow HTTPS service permanently
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: create the index.html using Jinja2 template file
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Restart Apache
  become: true