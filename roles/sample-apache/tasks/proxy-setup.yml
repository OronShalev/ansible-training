
- name: Ensure firewalld is installed and running
  ansible.builtin.yum:
    name: firewalld
    state: present
  become: true

- name: Start and enable firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  become: true

- name: Allow HTTP service permanently
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Allow HTTPS service permanently
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled
  become: true